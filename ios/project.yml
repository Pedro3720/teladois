name: TelaDois
options:
  bundleIdPrefix: com.pedrovviana
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.5.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  TelaDoisCore:
    path: Packages/TelaDoisCore
targets:
  TelaDois:
    type: application
    platform: iOS
    sources: [TelaDois]
    dependencies:
      - package: TelaDoisCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pedrovviana.teladois
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: TelaDois
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIStatusBarHidden: YES
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "A temperatura do Modo Descanso usa a sua localização aproximada."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
  TelaDoisUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: TelaDoisUITests
        excludes: ["Fixtures/**"]
      - path: TelaDoisUITests/Fixtures
        buildPhase: resources
    dependencies:
      - target: TelaDois
      - package: TelaDoisCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: TelaDois
schemes:
  TelaDois:
    build:
      targets:
        TelaDois: all
    test:
      targets:
        - TelaDoisUITests
