name: ios-build
on:
  push:
    branches: [main]
    paths: ["ios/**", ".github/workflows/ios-build.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Instalar XcodeGen
        run: brew install xcodegen
      - name: Gerar projeto
        working-directory: ios
        run: xcodegen generate
      - name: Compilar para iPhone (sem assinatura)
        working-directory: ios
        run: |
          xcodebuild build \
            -project TelaDois.xcodeproj \
            -scheme TelaDois \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath ../build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
      - name: Empacotar .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/TelaDois.app Payload/
          zip -qry TelaDois.ipa Payload
          ls -lh TelaDois.ipa
      - uses: actions/upload-artifact@v7
        with:
          name: TelaDois-ipa
          path: TelaDois.ipa
          if-no-files-found: error
