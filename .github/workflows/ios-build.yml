name: ios-build
on:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios-build.yml"
      - ".github/scripts/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Toolchain fixa (default atual do macos-15): Xcode 16.4 / iOS SDK 18.5.
  DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Versão do Xcode
        run: xcodebuild -version
      - name: Instalar XcodeGen (versão fixa, SHA-256 verificado)
        run: bash .github/scripts/install-xcodegen.sh
      - name: Gerar projeto
        working-directory: ios
        run: xcodegen generate
      - name: Compilar para iPhone (sem assinatura)
        working-directory: ios
        run: |
          # LM_SKIP_METADATA_EXTRACTION=YES silencia o aviso de metadados de App Intents;
          # remover se o app passar a usar App Intents (Atalhos/widgets).
          # CURRENT_PROJECT_VERSION = número da execução (vira CFBundleVersion, rastreia o .ipa).
          xcodebuild build \
            -project TelaDois.xcodeproj \
            -scheme TelaDois \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath ../build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            LM_SKIP_METADATA_EXTRACTION=YES
      - name: Empacotar .ipa
        run: |
          mkdir -p Payload out
          cp -R build/Build/Products/Release-iphoneos/TelaDois.app Payload/
          zip -qry out/TelaDois.ipa Payload
          {
            echo "commit: ${{ github.sha }}"
            echo "run_number: ${{ github.run_number }}"
            echo "date_utc: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > out/BUILD_INFO.txt
          cat out/BUILD_INFO.txt
          ls -lh out
      - uses: actions/upload-artifact@v7
        with:
          name: TelaDois-ipa
          path: out
          if-no-files-found: error
