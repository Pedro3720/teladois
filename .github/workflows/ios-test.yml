name: ios-test
on:
  push:
    branches: [main, "etapa-*"]
    paths:
      - "ios/**"
      - ".github/workflows/ios-test.yml"
      - ".github/scripts/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Toolchain fixa (default atual do macos-15): Xcode 16.4 / iOS SDK 18.5.
  DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Versão do Xcode
        run: xcodebuild -version
      - name: Instalar XcodeGen (versão fixa, SHA-256 verificado)
        run: bash .github/scripts/install-xcodegen.sh
      - name: Gerar projeto
        working-directory: ios
        run: xcodegen generate
      - name: Escolher simulador
        id: sim
        run: echo "udid=$(bash .github/scripts/pick-simulator.sh)" >> "$GITHUB_OUTPUT"
      - name: Rodar testes
        working-directory: ios
        run: |
          # LM_SKIP_METADATA_EXTRACTION=YES silencia o aviso de metadados de App Intents;
          # remover se o app passar a usar App Intents (Atalhos/widgets).
          xcodebuild test \
            -project TelaDois.xcodeproj \
            -scheme TelaDois \
            -destination "id=${{ steps.sim.outputs.udid }},arch=arm64" \
            -resultBundlePath ../TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            LM_SKIP_METADATA_EXTRACTION=YES
      - name: Exportar prints
        if: always()
        run: |
          mkdir -p screenshots
          if [ -d TestResults.xcresult ]; then
            xcrun xcresulttool export attachments --path TestResults.xcresult --output-path screenshots
            python3 .github/scripts/rename-screenshots.py screenshots
          fi
      - name: Exigir ao menos um print
        if: success()
        run: |
          count="$(find screenshots -name '*.png' | wc -l | tr -d ' ')"
          echo "prints exportados: $count"
          if [ "$count" -eq 0 ]; then
            echo "testes passaram mas nenhum .png foi exportado" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screenshots
          path: screenshots
          if-no-files-found: warn
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: TestResults.xcresult
          if-no-files-found: ignore
