name: prototype-test
on:
  push:
    paths: ["prototype/**", ".github/workflows/prototype-test.yml"]
  pull_request:
    paths: ["prototype/**", ".github/workflows/prototype-test.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: prototype
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Instalar dependências
        run: npm ci
      - name: Instalar WebKit
        run: npx playwright install --with-deps webkit
      - name: Rodar testes (WebKit, iPhone em paisagem)
        run: npx playwright test
