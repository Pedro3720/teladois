name: windows-test
on:
  push:
    branches: [main, "etapa-*"]
    paths:
      - "windows/**"
      - ".github/workflows/windows-test.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: windows/global.json
      - name: Testes do PC
        # Category=Local roda o FFmpeg de verdade (só no PC do usuário).
        run: dotnet test windows/TelaDois.sln -c Release --filter "Category!=Local"
